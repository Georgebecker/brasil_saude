name: CI

on:
  push:
  pull_request:

jobs:
  verificacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências
        run: pip install -r requirements.txt
      - name: Lint
        run: python -m ruff check .
      - name: Testes
        run: python -m pytest -q
